# Aggregation config fixture mixing valid and invalid sections, used by the
# storage/writer regression tests to verify that hot-reloading tolerates and
# skips broken sections instead of aborting the whole load.

[good_min]
pattern = \.min$
xFilesFactor = 0.1
aggregationMethod = min

# xFilesFactor outside the [0, 1] range -> historically raised AssertionError.
[bad_xff_out_of_range]
pattern = \.bad_xff$
xFilesFactor = 5
aggregationMethod = average

# aggregationMethod unsupported by the backend -> historically raised AssertionError.
[bad_method]
pattern = \.bad_method$
xFilesFactor = 0.5
aggregationMethod = bogus

# Non-numeric xFilesFactor -> raises ValueError from float().
[bad_xff_not_a_number]
pattern = \.bad_nan$
xFilesFactor = notanumber
aggregationMethod = average

[good_sum]
pattern = \.count$
xFilesFactor = 0
aggregationMethod = sum
